<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Placed — SneakerHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav>
  <a href="index.html" class="nav-logo">Sneaker<span>Hub</span></a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
  </div>
</nav>

<div class="success-page">
  <div class="success-icon">✓</div>
  <h1>ORDER PLACED!</h1>
  <p>Your sneakers are on their way! You'll receive a confirmation email shortly with tracking details.</p>
  <div class="order-id">Order ID: <span id="orderId">#SH-000000</span></div>

  <div style="display:flex;gap:40px;justify-content:center;margin-bottom:40px;flex-wrap:wrap;">
    <div style="text-align:center;">
      <div style="font-size:28px;margin-bottom:8px;">📦</div>
      <div style="font-size:13px;font-weight:600;color:var(--white);">Processing</div>
      <div style="font-size:12px;color:var(--gray);">Right now</div>
    </div>
    <div style="display:flex;align-items:center;color:var(--border);font-size:20px;">→</div>
    <div style="text-align:center;opacity:0.5;">
      <div style="font-size:28px;margin-bottom:8px;">🚚</div>
      <div style="font-size:13px;font-weight:600;color:var(--white);">Shipped</div>
      <div style="font-size:12px;color:var(--gray);">1–2 days</div>
    </div>
    <div style="display:flex;align-items:center;color:var(--border);font-size:20px;">→</div>
    <div style="text-align:center;opacity:0.5;">
      <div style="font-size:28px;margin-bottom:8px;">🏠</div>
      <div style="font-size:13px;font-weight:600;color:var(--white);">Delivered</div>
      <div style="font-size:12px;color:var(--gray);">5–7 days</div>
    </div>
  </div>

  <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;">
    <a href="index.html" class="btn-primary">Continue Shopping →</a>
    <a href="products.html" class="btn-outline">Browse More Sneakers</a>
  </div>
</div>

<script src="script.js"></script>
<script>
  // Generate a random order ID
  const orderId = "#SH-" + Math.floor(100000 + Math.random() * 900000);
  document.getElementById("orderId").textContent = orderId;
</script>
</body>
</html>
