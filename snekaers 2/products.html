<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — SneakerHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav>
  <a href="index.html" class="nav-logo">Sneaker<span>Hub</span></a>

  <div class="search-bar-wrapper">
    <input type="text" id="searchInput" placeholder="Search sneakers, brands…" autocomplete="off">
    <span class="search-icon">🔍</span>
    <div class="search-dropdown" id="searchDropdown"></div>
  </div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="products.html" class="active">Products</a>
    <a href="cart.html" class="nav-cart">
      🛒 Cart
      <span class="cart-count" style="display:none">0</span>
    </a>
  </div>
</nav>

<!-- FILTERS BAR -->
<div class="filters-bar">
  <span class="filter-label">Category</span>
  <button class="filter-btn active" data-cat="All" onclick="filterCategory('All')">All</button>
  <button class="filter-btn" data-cat="Men" onclick="filterCategory('Men')">Men</button>
  <button class="filter-btn" data-cat="Women" onclick="filterCategory('Women')">Women</button>
  <button class="filter-btn" data-cat="Sports" onclick="filterCategory('Sports')">Sports</button>
  <button class="filter-btn" data-cat="Casual" onclick="filterCategory('Casual')">Casual</button>

  <div class="filter-divider"></div>

  <span class="filter-label">Brand</span>
  <button class="filter-btn active" data-brand="All" onclick="filterBrand('All')">All</button>
  <button class="filter-btn" data-brand="Nike" onclick="filterBrand('Nike')">Nike</button>
  <button class="filter-btn" data-brand="Adidas" onclick="filterBrand('Adidas')">Adidas</button>
  <button class="filter-btn" data-brand="Puma" onclick="filterBrand('Puma')">Puma</button>
  <button class="filter-btn" data-brand="Converse" onclick="filterBrand('Converse')">Converse</button>

  <select class="sort-select" onchange="sortProducts(this.value)">
    <option value="default">Sort: Default</option>
    <option value="asc">Price: Low to High</option>
    <option value="desc">Price: High to Low</option>
  </select>
</div>

<!-- PAGE TITLE -->
<div class="section-header">
  <h2>All <span>Sneakers</span> 👟</h2>
</div>

<!-- PRODUCT GRID -->
<div class="product-grid" id="products"></div>

<!-- FOOTER -->
<footer>
  <div class="footer-grid">
    <div>
      <div class="footer-brand">Sneaker<span>Hub</span></div>
      <p class="footer-desc">Your one-stop destination for premium, authentic sneakers.</p>
    </div>
    <div class="footer-col">
      <h4>Shop</h4>
      <a href="products.html">All Products</a>
      <a href="#">Men's</a>
      <a href="#">Women's</a>
      <a href="#">Sports</a>
    </div>
    <div class="footer-col">
      <h4>Help</h4>
      <a href="#">Track Order</a>
      <a href="#">Returns</a>
      <a href="#">Sizing Guide</a>
    </div>
    <div class="footer-col">
      <h4>Company</h4>
      <a href="#">About Us</a>
      <a href="#">Blog</a>
      <a href="#">Contact</a>
    </div>
  </div>
  <div class="footer-bottom">
    <span>© 2025 SneakerHub. All rights reserved.</span>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
